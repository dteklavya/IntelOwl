name: intelowl-dev
# Extend the repo's default configuration
services:
  # Override postgres with dev-specific settings
  postgres:
    extends:
      file: ../docker/default.yml
      service: postgres
    container_name: intelowl_postgres_dev
    environment:
      POSTGRES_DB: intelowl
      POSTGRES_USER: intelowl
      POSTGRES_PASSWORD: intelowl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - intelowl-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelowl"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Override rabbitmq with dev-specific settings
  rabbitmq:
    extends:
      file: ../docker/default.yml
      service: rabbitmq
    container_name: intelowl_rabbitmq_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ../configuration/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - intelowl-dev
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 30s
      retries: 5


  # Elasticsearch for development
  elasticsearch:
    image: eklavvya/elasticsearch-light-testing:latest
    container_name: elasticsearch
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - intelowl-dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Override nginx for development
  nginx:
    extends:
      file: ../docker/default.yml
      service: nginx
    container_name: intelowl_nginx_dev
    ports:
      - "80:80"
    volumes:
      - ../configuration/nginx/http.conf:/etc/nginx/conf.d/default.conf
      - ../configuration/nginx/errors.conf:/etc/nginx/errors.conf
      - ../configuration/nginx/locations.conf:/etc/nginx/locations.conf
      - nginx_logs:/var/log/nginx
      - static_content:/var/www/static
    depends_on:
      - uwsgi
    networks:
      - intelowl-dev

  # Development app container (replaces uwsgi)
  uwsgi:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: intelowl_uwsgi_dev

    volumes:
      - ..:/opt/deploy/intelowl:cached
    healthcheck:
      disable: true
    environment:
      - DEBUG=True
      - DJANGO_TEST_SERVER=True
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=intelowl
      - DB_USER=intelowl
      - DB_PASSWORD=intelowl
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTIC_ENDPOINT=http://elasticsearch:9200
      - ELASTICSEARCH_PORT=9200
    ports:
      - "8001:8001"
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - intelowl-dev
    command:
      - sh
      - -c
      - |
        # Terminal multiplex: Django foreground + tail logs in background
        python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8001 2>&1 | tee -a /var/log/intelowl/django/devserver.log &

        # Tail ALL logs (including tee'd devserver)
        tail -F /var/log/intelowl/**/*.log

        # Django server keeps container alive (devcontainer happy)
        wait %1  # Wait specifically for Django PID

  # Development celery worker
  celery_worker_default:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: intelowl_celery_worker_default_dev
    restart: "no"
    volumes:
      - ..:/opt/deploy/intelowl:cached
      - generic_logs:/var/log/intelowl
      - mlmodels:/opt/deploy/intelowl/mlmodels
    environment:
      - DEBUG=True
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=intelowl
      - DB_USER=intelowl
      - DB_PASSWORD=intelowl
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTIC_ENDPOINT=http://elasticsearch:9200
      - ELASTICSEARCH_PORT=9200
    working_dir: /opt/deploy/intelowl  # CRITICAL: Set cwd
    healthcheck:
      disable: true
    ports:
      - 5679:5678
    command:
      - sh
      - -c
      - |
        # Celery with debugpy FOREGROUND → logs to file + stdout
        python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 \
          --wait-for-client -m celery -A intelowl.celery worker \
          -n worker_default -Q default -c 1 --pidfile= --pool=solo \
          2>&1 | tee -a /var/log/intelowl/django/celery_worker_default.log &

        # Tail ALL logs (including tee'd celery)
        tail -F /var/log/intelowl/django/*.log

        # Keep celery foreground PID alive (healthcheck happy)
        wait %1
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - intelowl-dev

  # Development celery beat
  celery_beat:
    extends:
      file: ../docker/default.yml
      service: celery_beat
    container_name: intelowl_celery_beat_dev
    volumes:
      - ..:/opt/deploy/intelowl:cached
    environment:
      - DEBUG=True
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=intelowl
      - DB_USER=intelowl
      - DB_PASSWORD=intelowl
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTIC_ENDPOINT=http://elasticsearch:9200
      - ELASTICSEARCH_PORT=9200
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - intelowl-dev

networks:
  intelowl-dev:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:
  nginx_logs:
  generic_logs:
  static_content:
  mlmodels: